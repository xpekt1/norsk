<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norsk Ordkort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, tab bar on top, a single card in the centre of each study screen */
:root{
  --bg:#0e141b;          /* winter night */
  --surface:#161f29;
  --surface-2:#1e2935;
  --line:#2a3846;
  --fg:#e7edf2;
  --muted:#8fa0b1;
  --accent:#e8676b;      /* flag red, softened */
  --blue:#6f9fd6;        /* flag blue, lifted for dark */
  --good:#4fbf8a;
  --bad:#e5534b;
  --warn:#d9a94a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(32px + env(safe-area-inset-bottom,0px));}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.voicewarn{font-size:.8rem;color:var(--warn)}

nav{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{background:none;border:0;border-radius:9px;padding:9px 2px;color:var(--muted);font-weight:700;font-size:.9rem;min-width:0}
nav button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
nav small{display:block;font-weight:400;font-size:.7rem;opacity:.75}

.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}
.stats .due b{color:var(--blue)} .stats .new b{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--fg);background:var(--surface-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;margin-top:12px;position:relative}
.card.tap{cursor:pointer}
.card.right{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.card.wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.cat{position:absolute;top:12px;left:16px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prompt{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,6vw,2rem);line-height:1.2;text-wrap:balance}
.answer{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.1;color:var(--fg)}
.hint{color:var(--muted);font-size:.9rem}
.sent{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;width:100%;display:grid;gap:2px}
.sent .no{font-size:1.05rem}
.sent .en{color:var(--muted);font-size:.9rem}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--fg);vertical-align:middle}
.say svg{width:16px;height:16px}

.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700}
.grades small{display:block;font-weight:400;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.g1{color:var(--bad)} .g2{color:var(--warn)} .g3{color:var(--good)} .g4{color:var(--blue)}
.big{width:100%;margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.primary{background:var(--accent);border-color:var(--accent);color:#1a0d0e}

.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#1a0d0e;display:grid;place-items:center;margin:8px auto 0;transition:transform .15s}
.mic svg{width:40px;height:40px}
.mic.on{animation:pulse 1.1s ease-in-out infinite;background:var(--blue)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(111,159,214,.5)}50%{box-shadow:0 0 0 16px rgba(111,159,214,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.heard{font-size:.95rem;min-height:1.5em}
.heard b{font-weight:700}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.tries{font-size:.8rem;color:var(--muted)}
.smallbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:4px;font-size:.9rem}

.list{display:grid;gap:6px;margin-top:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item input{width:20px;height:20px;accent-color:var(--accent)}
.item .w{min-width:0}
.item .w b{display:block}
.item .w span{color:var(--muted);font-size:.85rem}
.item .st{font-size:.72rem;color:var(--muted);display:block}
.item .act{display:flex;gap:6px;align-items:center}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--fg)}
.iconbtn svg{width:16px;height:16px}

h2{font-family:var(--display);font-size:1.15rem;margin:22px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20}
.empty{color:var(--muted);text-align:center}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:6px;margin-top:4px}
.today .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.today h2{margin:0;font-size:1.7rem;line-height:1.15;text-wrap:balance}
.today .sub{color:var(--muted)}
.lrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.lrow:disabled{opacity:.45;cursor:default}
.lrow .num{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums}
.lrow.done .num{background:var(--good);color:#0e141b}
.lrow.cur .num{background:var(--accent);color:#1a0d0e}
.lrow .t{min-width:0}
.lrow .t b{display:block}
.lrow .t span{color:var(--muted);font-size:.85rem}
.lrow .s{font-size:.8rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px}
.steps span{height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.past{background:var(--good)}
.stepname{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lhead h2{margin:0;font-size:1.25rem}
.wl{display:grid;gap:6px}
.wcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:12px;padding:12px;display:grid;gap:4px}
.wcard .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wcard .top b{font-family:var(--display);font-size:1.35rem}
.wcard .top span{color:var(--muted)}
.wcard .ex{font-size:.92rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wcard .ex i{color:var(--muted);font-style:normal}
.gram{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.gram h3{font-family:var(--display);margin:0;font-size:1.25rem;text-wrap:balance}
.gram p{margin:0;max-width:65ch}
.gram .exs{display:grid;gap:8px}
.gram .exs div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.gram .exs i{color:var(--muted);font-style:normal;font-size:.9rem}
.qq{font-family:var(--display);font-size:1.3rem;margin:6px 0 10px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;width:100%}
.opt .nb{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#0e141b}
.opt:nth-child(1) .nb{background:#6f9fd6}.opt:nth-child(2) .nb{background:#d9a94a}.opt:nth-child(3) .nb{background:#b58ad9}.opt:nth-child(4) .nb{background:#e8676b}
.opt .ot{min-width:0;display:grid;gap:4px;padding-top:6px}
.opt .ot b{font-weight:700}
.opt .oe{font-size:.86rem;color:var(--muted)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default;color:var(--fg)}
.key{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-size:.92rem}
.task{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:18px;display:grid;gap:8px}
.task p{margin:0;font-size:1.05rem}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:12px}
.letters button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-family:var(--display);font-weight:700;font-size:1.5rem;transition:transform .12s,background .12s}
.letters button.ext{color:var(--accent)}
.letters button.lit{background:var(--blue);border-color:var(--blue);color:#0e141b;transform:scale(1.08)}
.lyrics{display:grid;gap:4px;margin-top:14px;font-size:1.05rem}
.lyrics span{color:var(--muted);transition:color .1s}
.lyrics span.lit{color:var(--fg);font-weight:700}
.snd{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.snd .L{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;text-align:center;background:none;border:0;color:var(--fg);padding:4px 0}
.snd .L.ext{color:var(--accent)}
.snd .d{min-width:0;display:grid;gap:4px}
.snd .d .nm{font-size:.85rem;color:var(--muted)}
.snd .d .ex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 class="brand">Norsk <span>Ordkort</span></h1>
  <span class="voicewarn" id="voiceWarn" hidden>No Norwegian voice found</span>
</header>

<nav role="tablist">
  <button role="tab" data-tab="learn" aria-selected="true">Lær<small>Lessons</small></button>
  <button role="tab" data-tab="cards" aria-selected="false">Kort<small>Cards</small></button>
  <button role="tab" data-tab="speak" aria-selected="false">Snakk<small>Speak</small></button>
  <button role="tab" data-tab="abc" aria-selected="false">ABC<small>Alphabet</small></button>
  <button role="tab" data-tab="words" aria-selected="false">Ord<small>Words</small></button>
  <button role="tab" data-tab="settings" aria-selected="false">Mer<small>Settings</small></button>
</nav>

<section id="tab-learn"></section>
<section id="tab-cards" hidden></section>
<section id="tab-speak" hidden></section>
<section id="tab-abc" hidden></section>
<section id="tab-words" hidden></section>
<section id="tab-settings" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>

const DATA = {

 ["takk","thank you","Takk for maten.","Thanks for the food."],

 ["vær så snill","please","Kan du hjelpe meg, vær så snill?","Can you help me, please?"],

],

 ["å komme","to come","Kommer du i morgen?","Are you coming tomorrow?"],
 ["å spise","to eat","Hva vil du spise?","What do you want to eat?"],

 ["å vite","to know (a fact)","Jeg vet ikke.","I don't know."],

 ["å jobbe","to work","Jeg jobber i Tokyo.","I work in Tokyo."],

 ["å skrive","to write","Kan du skrive det ned?","Can you write it down?"],
 ["å kjøpe","to buy","Jeg må kjøpe melk.","I have to buy milk."],
 ["å lage","to make","Jeg lager mat.","I am cooking."],
 ["å elske","to love","Jeg elsker deg.","I love you."],
 ["å hjelpe","to help","Kan jeg hjelpe deg?","Can I help you?"],
 ["å trenge","to need","Jeg trenger en pause.","I need a break."],
 ["å glemme","to forget","Jeg glemte nøkkelen.","I forgot the key."]
],
"Food":[

 ["et vann","water","Kan jeg få et glass vann?","Can I have a glass of water?"],
 ["en kaffe","coffee","Vil du ha en kopp kaffe?","Do you want a cup of coffee?"],
 ["en te","tea","Jeg drikker grønn te.","I drink green tea."],

],
"Home & places":[

],

 ["nå","now","Jeg må gå nå.","I have to go now."],
 ["en dag","day","Ha en fin dag!","Have a nice day!"],
 ["en uke","week","Vi ses neste uke.","See you next week."],

 ["en kveld","evening","Hva skal du i kveld?","What are you doing this evening?"],

],
"Adjectives":[
 ["god","good","Maten er god.","The food is good."],
 ["stor","big","Det er et stort hus.","It's a big house."],
 ["liten","small","Hunden er liten.","The dog is small."],
 ["kald","cold","Det er kaldt ute.","It's cold outside."],
 ["varm","warm / hot","Kaffen er varm.","The coffee is hot."],
 ["fin","nice / pretty","For en fin dag!","What a nice day!"],
 ["trøtt","tired","Jeg er så trøtt.","I'm so tired."],
 ["sulten","hungry","Er du sulten?","Are you hungry?"],

],

 ["hvem","who","Hvem er det?","Who is that?"],

 ["hvor mye","how much","Hvor mye koster det?","How much does it cost?"]
],
"Numbers":[
 ["en","one","Jeg har en bror.","I have one brother."],
 ["to","two","Vi har to katter.","We have two cats."],
 ["tre","three","Hun snakker tre språk.","She speaks three languages."],
 ["fire","four","Klokka er fire.","It's four o'clock."],

/* ---------- State ---------- */
const KEY = "norsk-ordkort-v1";
const DAY = 864e5;
let S = load();
function blank(){
  return {lessons:{}, deck:{}, srs:{normal:{},speak:{},sentence:{}}, custom:[], newToday:{date:"",normal:0,speak:0,sentence:0},
    settings:{voice:"",rate:0.85,newPerDay:10,front:"en"}};
}
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s){ s=blank(); }
  const b=blank();
  s.srs=Object.assign(b.srs,s.srs||{}); s.settings=Object.assign(b.settings,s.settings||{});
  s.newToday=Object.assign(b.newToday,s.newToday||{}); s.custom=s.custom||[]; s.deck=s.deck||{}; s.lessons=s.lessons||{};
  return s;
}
function seedStarter(s){ for(const c of STARTER) for(const w of DATA[c]) s.deck[c+":"+w[0]]=true; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function allWords(){
  const out=[];
  for(const c in DATA) for(const w of DATA[c]) out.push({id:c+":"+w[0],no:w[0],en:w[1],s:w[2],se:w[3],c,alt:ALTS[w[0]]||[]});
  for(const w of S.custom) out.push(Object.assign({c:"Mine",alt:[]},w));
  return out;
}
let WORDS=allWords(), BYID={};
function reindex(){ WORDS=allWords(); BYID={}; WORDS.forEach(w=>BYID[w.id]=w); }
reindex();

function today(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function newCount(mode){ if(S.newToday.date!==today()){ S.newToday={date:today(),normal:0,speak:0,sentence:0}; } return S.newToday[mode]||0; }

/* ---------- Scheduling (simple SM-2) ---------- */
function grade(rec,g,now){
  const r=Object.assign({int:0,ease:2.5,reps:0},rec||{});
  if(g===1){ r.reps=0; r.int=0; r.ease=Math.max(1.3,r.ease-0.2); r.due=now+60e3; return r; }
  if(r.reps===0){ if(g===2){ r.due=now+600e3; return r; } r.int=g===4?3:1; }
  else if(r.reps===1){ r.int=g===2?2:g===3?3:6; }
  else { r.int=g===2?r.int*1.2:g===3?r.int*r.ease:r.int*r.ease*1.3; }
  if(g===2) r.ease=Math.max(1.3,r.ease-0.15);
  if(g===4) r.ease+=0.15;
  r.int=Math.max(1,Math.round(r.int*10)/10); r.reps++; r.due=now+r.int*DAY; return r;
}
function fmtGap(ms){
  if(ms<3600e3) return Math.max(1,Math.round(ms/60e3))+" min";
  if(ms<DAY) return Math.round(ms/3600e3)+" h";
  const d=ms/DAY; if(d<30) return Math.round(d)+" d";
  return (Math.round(d/30*10)/10)+" mo";
}
function deckIds(mode){
  return Object.keys(S.deck).filter(id=>S.deck[id]&&BYID[id]&&(mode!=="sentence"||BYID[id].s));
}
function buildQueue(mode,extraNew=0){
  const now=Date.now(), ids=deckIds(mode), rec=S.srs[mode];
  const due=ids.filter(id=>rec[id]&&rec[id].due<=now).sort((a,b)=>rec[a].due-rec[b].due);
  const room=Math.max(0,S.settings.newPerDay-newCount(mode))+extraNew;
  const fresh=ids.filter(id=>!rec[id]).slice(0,room);
  return [...due,...fresh];
}
function counts(mode){
  const now=Date.now(), ids=deckIds(mode), rec=S.srs[mode];
  return {due:ids.filter(id=>rec[id]&&rec[id].due<=now).length,
          fresh:Math.min(ids.filter(id=>!rec[id]).length,Math.max(0,S.settings.newPerDay-newCount(mode))),
          total:ids.length};
}
function applyGrade(mode,id,g){
  const rec=S.srs[mode];
  if(!rec[id]){ newCount(mode); S.newToday[mode]++; }
  rec[id]=grade(rec[id],g,Date.now()); save();
  return rec[id];
}

let current="learn";
let voices=[];
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  voices=speechSynthesis.getVoices().filter(v=>/^(nb|no|nn)\b/i.test(v.lang));
  document.getElementById("voiceWarn").hidden=voices.length>0;
  if(current==="settings") renderSettings();
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function say(text,onend){
  if(!("speechSynthesis" in window)){ onend&&onend(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/^å /,""));
  u.lang="nb-NO"; u.rate=S.settings.rate;
  const v=voices.find(v=>v.name===S.settings.voice)||voices[0]; if(v) u.voice=v;
  let done=false; const fin=()=>{ if(!done){done=true; onend&&onend();} };
  u.onend=fin; u.onerror=fin; setTimeout(fin,6000);
  speechSynthesis.speak(u);
}
const ICON_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- Speech recognition ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const DIGITS={"0":"null","1":"en","2":"to","3":"tre","4":"fire","5":"fem","6":"seks","7":"sju","8":"åtte","9":"ni","10":"ti","11":"elleve","12":"tolv","20":"tjue","100":"hundre"};
function norm(s){
  return s.toLowerCase().normalize("NFC").replace(/[.,!?¡¿"'()«»:;]/g," ").replace(/\b\d+\b/g,d=>DIGITS[d]||d).replace(/\s+/g," ").trim();
}
function stripLead(s){ return s.replace(/^(å|en|ei|et) (?=\S)/,""); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function sim(a,b){ return 1-lev(a,b)/Math.max(a.length,b.length,1); }
function checkWord(alts,w){
  const targets=[w.no,...w.alt].map(t=>stripLead(norm(t)));
  let best={ok:false,score:0,heard:alts[0]||""};
  for(const raw of alts){
    const a=stripLead(norm(raw));
    for(const t of targets){
      if(a===t||(" "+a+" ").includes(" "+t+" ")) return {ok:true,score:1,heard:raw};
      const sc=sim(a,t); if(sc>best.score) best={ok:sc>=0.8,score:sc,heard:raw};
    }
  }
  return best;
}
function checkSentence(alts,w){
  const t=norm(w.s).split(" ");
  let best={ok:false,score:0,heard:alts[0]||""};
  for(const raw of alts){
    const a=norm(raw).split(" "); let hit=0;
    for(const tok of t){ if(a.some(x=>x===tok||sim(x,tok)>=0.8)) hit++; }
    const sc=hit/t.length; if(sc>best.score) best={ok:sc>=0.8,score:sc,heard:raw};
  }
  return best;
}
let rec=null;
function listen(onres,onfail){
  if(!SR){ onfail("unsupported"); return; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  try{ if(rec) rec.abort(); }catch(e){}
  rec=new SR(); rec.lang="nb-NO"; rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
  let got=false;
  rec.onresult=e=>{ got=true; onres([...e.results[0]].map(r=>r.transcript)); };
  rec.onerror=e=>{ got=true; onfail(e.error); };
  rec.onend=()=>{ if(!got) onfail("no-speech"); };
  try{ rec.start(); }catch(e){ onfail("start"); }
}

/* ---------- Normal cards ---------- */
let N={queue:null,flipped:false,dir:null};
function statsHtml(mode){
  const c=counts(mode);
  return `<div class="stats"><span class="due">Due <b>${c.due}</b></span><span class="new">New <b>${c.fresh}</b></span><span>In deck <b>${c.total}</b></span></div>`;
}
function doneHtml(mode){
  const rec=S.srs[mode], ids=deckIds(mode);
  const next=ids.map(id=>rec[id]&&rec[id].due).filter(Boolean).sort((a,b)=>a-b)[0];
  const left=ids.filter(id=>!rec[id]).length;
  return `<div class="card"><div class="prompt">Ferdig for i dag!</div>
    <div class="hint">Done for today.${next?` Next review in ${fmtGap(next-Date.now())}.`:""}</div>
    ${left?`<button class="big" data-more="${mode}">Learn 5 more new words (${left} left)</button>`:
      (ids.length?`<div class="hint">Do the next lesson in <b>Lær</b> to add more words.</div>`:`<div class="hint">No words yet. Start with lesson 1 in <b>Lær</b>.</div>`)}</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-more]"); if(!b) return;
  const m=b.dataset.more;
  if(m==="normal"){ N.queue=buildQueue("normal",5); renderCards(); }
  else { SP.queue=buildQueue(m,5); SP.reset(); renderSpeak(); }
});
function renderCards(){
  const el=$("#tab-cards");
  if(!N.queue||!N.queue.length) N.queue=buildQueue("normal");
  const front=S.settings.front;
  let h=statsHtml("normal")+`<div class="row" role="group" aria-label="Front side">
    <button class="chip" data-front="en" aria-pressed="${front==="en"}">English → Norsk</button>
    <button class="chip" data-front="no" aria-pressed="${front==="no"}">Norsk → English</button>
    <button class="chip" data-front="mix" aria-pressed="${front==="mix"}">Mixed</button></div>`;
  if(!N.queue.length){ el.innerHTML=h+doneHtml("normal"); bindFront(); return; }
  const id=N.queue[0], w=BYID[id];
  if(!N.dir) N.dir=front==="mix"?(Math.random()<.5?"en":"no"):front;
  const r=S.srs.normal[id];
  const tag=!r?"New":r.reps===0?"Learning":"Review";
  if(!N.flipped){
    h+=`<div class="card tap" id="flip" role="button" tabindex="0" aria-label="Show answer"><span class="cat">${esc(w.c)} · ${tag}</span>
      ${N.dir==="en"?`<div class="prompt">${esc(w.en)}</div><div class="hint">Say it out loud in Norwegian, then tap</div>`
        :`<div class="answer">${esc(w.no)}</div>${sayBtn(w.no)}<div class="hint">What does it mean? Tap to check</div>`}
    </div><button class="big" id="flipBtn">Show answer</button>`;
  }else{
    const now=Date.now(), lab=g=>{ const n=grade(r,g,now); return fmtGap(n.due-now); };
    h+=`<div class="card"><span class="cat">${esc(w.c)} · ${tag}</span>
      <div class="hint">${esc(w.en)}</div>
      <div class="answer">${esc(w.no)}</div>${sayBtn(w.no)}
      ${w.s?`<div class="sent"><div class="no">${esc(w.s)} ${sayBtn(w.s)}</div><div class="en">${esc(w.se)}</div></div>`:""}
    </div>
    <div class="grades">
      <button class="g1" data-g="1">Again<small>${lab(1)}</small></button>
      <button class="g2" data-g="2">Hard<small>${lab(2)}</small></button>
      <button class="g3" data-g="3">Good<small>${lab(3)}</small></button>
      <button class="g4" data-g="4">Easy<small>${lab(4)}</small></button>
    </div>`;
  }
  el.innerHTML=h; bindFront();
  const flip=()=>{ N.flipped=true; renderCards(); say(w.no); };
  const f=$("#flip"); if(f){ f.onclick=flip; f.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();} }; $("#flipBtn").onclick=flip; }
  el.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g; applyGrade("normal",id,g); N.queue.shift();
    if(g===1) N.queue.splice(Math.min(3,N.queue.length),0,id);
    N.flipped=false; N.dir=null; renderCards();
  });
}
function bindFront(){
  document.querySelectorAll("[data-front]").forEach(b=>b.onclick=()=>{ S.settings.front=b.dataset.front; save(); N.dir=null; N.flipped=false; renderCards(); });

/* ---------- Speak mode ---------- */
const SP={mode:"speak",queue:null,status:"idle",tries:0,hinted:false,heard:"",score:0,timer:null,
  reset(){ this.status="idle"; this.tries=0; this.hinted=false; this.heard=""; this.score=0; clearTimeout(this.timer); }};
function renderSpeak(){
  const el=$("#tab-speak"), mode=SP.mode;
  if(!SP.queue||!SP.queue.length) SP.queue=buildQueue(mode);
  let h=statsHtml(mode)+`<div class="row" role="group" aria-label="What to say">
    <button class="chip" data-spm="speak" aria-pressed="${mode==="speak"}">Words</button>
    <button class="chip" data-spm="sentence" aria-pressed="${mode==="sentence"}">Sentences</button></div>`;
  if(!SR){
    h+=`<div class="card"><div class="prompt">Microphone checking isn't supported here</div>
      <div class="hint">Open this file in <b>Chrome</b> (computer or Android) or <b>Safari</b> on iPhone/iPad. Normal cards still work everywhere.</div></div>`;
    el.innerHTML=h; bindSpm(); return;
  }
  if(!SP.queue.length){ el.innerHTML=h+doneHtml(mode); bindSpm(); return; }
  const id=SP.queue[0], w=BYID[id], sent=mode==="sentence";
  const target=sent?w.s:w.no, prompt=sent?w.se:w.en;
  const st=SP.status, cls=st==="right"?"right":(st==="wrong"||st==="revealed")?"wrong":"";
  h+=`<div class="card ${cls}"><span class="cat">${esc(w.c)}${S.srs[mode][id]?"":" · New"}</span>
    <div class="hint">Say in Norwegian</div>
    <div class="prompt">${esc(prompt)}</div>
    ${(st==="right"||st==="revealed")?`<div class="answer" style="font-size:${sent?"1.4rem":""}">${esc(target)}</div>${sayBtn(target)}`:""}
    <div class="heard" aria-live="polite">${SP.heard?`Heard: <b>${esc(SP.heard)}</b>`:""}</div>
    <div class="verdict ${st==="right"?"ok":"no"}" aria-live="polite">${
      st==="right"?"Riktig! ✓":st==="wrong"?"Not quite. Try again ✗":st==="revealed"?"Here's the answer. It will come back soon.":st==="error"?esc(SP.err):""}</div>
    ${(st!=="right"&&st!=="revealed")?`<button class="mic ${st==="listening"?"on":""}" id="micBtn" aria-label="${st==="listening"?"Listening":"Tap and speak"}">${ICON_MIC}</button>
      <div class="tries">${st==="listening"?"Listening…":SP.tries?`Try ${SP.tries+1} of 3`:"Tap the mic and speak"}</div>
      <div class="smallbtns">
        <button class="link" id="hintBtn">Hear it</button>
        <button class="link" id="revealBtn">Show answer</button>
        ${SP.tries?`<button class="link" id="acceptBtn">I said it right</button>`:""}
      </div>`:""}
  </div>
  ${(st==="right"||st==="revealed")?`<button class="big primary" id="nextBtn">Next</button>`:""}`;
  el.innerHTML=h; bindSpm();
  const mic=$("#micBtn");
  if(mic) mic.onclick=()=>{
    if(SP.status==="listening"){ try{rec.stop();}catch(e){} return; }
    SP.status="listening"; SP.heard=""; renderSpeak();
    listen(alts=>{
      const res=sent?checkSentence(alts,w):checkWord(alts,w);
      SP.heard=res.heard; SP.score=res.score;
      if(res.ok) pass(id,w,target);
      else { SP.tries++; SP.status="wrong"; if(SP.tries>=3) reveal(id,target); else renderSpeak(); }
    },err=>{
      SP.status="error";
      SP.err=err==="not-allowed"||err==="service-not-allowed"?"Microphone blocked. Allow mic access for this page in the browser.":
        err==="no-speech"?"Didn't hear anything. Tap the mic and speak a bit louder.":
        err==="network"?"Speech checking needs an internet connection.":"Couldn't listen ("+err+"). Try again.";
      renderSpeak();
    });
  };
  const hb=$("#hintBtn"); if(hb) hb.onclick=()=>{ SP.hinted=true; say(target); };
  const rb=$("#revealBtn"); if(rb) rb.onclick=()=>reveal(id,target);
  const ab=$("#acceptBtn"); if(ab) ab.onclick=()=>pass(id,w,target);
  const nb=$("#nextBtn"); if(nb) nb.onclick=next;
}
function pass(id,w,target){
  SP.status="right";
  applyGrade(SP.mode,id,(SP.hinted||SP.tries>0)?2:3);
  renderSpeak();
  say(target,()=>{ SP.timer=setTimeout(()=>{ if(SP.status==="right"&&current==="speak") next(); },700); });
}
function reveal(id,target){
  SP.status="revealed"; applyGrade(SP.mode,id,1);
  SP.queue.push(SP.queue[0]); /* comes back at the end of this session */
  renderSpeak(); say(target);
}
function next(){ clearTimeout(SP.timer); SP.queue.shift(); SP.reset(); renderSpeak(); }
function bindSpm(){
  document.querySelectorAll("[data-spm]").forEach(b=>b.onclick=()=>{ SP.mode=b.dataset.spm; SP.queue=null; SP.reset(); renderSpeak(); });
}

let LS=null; /* active lesson state */
function lessonIndex(){ return LESSONS.findIndex((l,i)=>!S.lessons[i]); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQuiz(L){
  const ws=L.w.map(id=>BYID[id]).filter(Boolean);
  const pool=ws.length>=4?ws:ws.concat(WORDS.filter(w=>!L.w.includes(w.id)).slice(0,4));
  const vocab=shuffle(ws).slice(0,8).map((w,i)=>{
    const opts=shuffle([w,...shuffle(pool.filter(x=>x.id!==w.id)).slice(0,3)]);
    const toNo=i%2===0;
    return {q:toNo?`How do you say "${w.en}" in Norwegian?`:`What does "${w.no}" mean?`,say:toNo?null:w.no,
      o:opts.map(x=>toNo?x.no:x.en),a:opts.indexOf(w),ow:opts,n:w.no,
      e:opts.map(x=>x.id===w.id?`Correct. ${x.no} = ${x.en}`:`${x.no} = ${x.en}`),
      k:`${w.no} = ${w.en}`,ks:w.s||"",kse:w.se||""};
  });
  return [...vocab,...L.q.map((x,j)=>{ const a=(GQA[LESSONS.indexOf(L)]||[])[j]||[]; return Object.assign({},x,{n:a[0],ks:a[1],kse:a[2]}); })];
}
const STEP_NAMES=["New words","Grammar","Quiz","Speak","Together"];
function startLesson(i){
  const L=LESSONS[i];

  LS={i,step:0,wi:0,quiz:buildQuiz(L),qi:0,picked:null,wrong:0,sp:{ids:speakIds,k:0,status:"idle",tries:0,heard:""}};
  renderLearn(); window.scrollTo(0,0);

function renderLearn(){
  const el=$("#tab-learn");
  if(!LS){ el.innerHTML=lessonHome(); bindLessonHome(); return; }
  const L=LESSONS[LS.i];
  let h=`<div class="lhead"><button class="link" id="backL">← All lessons</button><span class="note">Lesson ${LS.i+1} of ${LESSONS.length}</span></div>
  <div class="lhead"><h2>${esc(L.t)}</h2></div>
  ${LS.step<5?`<div class="steps">${STEP_NAMES.map((n,i)=>`<span class="${i<LS.step?"past":i===LS.step?"on":""}"></span>`).join("")}</div>
  <div class="stepname">Step ${LS.step+1} of 5 · ${STEP_NAMES[LS.step]}</div>`:""}`;
  if(LS.step===0) h+=stepWords(L);
  else if(LS.step===1) h+=stepGrammar(L);
  else if(LS.step===2) h+=stepQuiz();
  else if(LS.step===3) h+=stepSpeak();
  else if(LS.step===4) h+=stepTogether(L);
  else h+=stepDone(L);

function stepQuiz(){
  const q=LS.quiz[LS.qi], ans=LS.picked!==null;

  <div class="qq">${esc(q.q)} ${q.say?sayBtn(q.say):""}</div><div class="opts">`;
  q.o.forEach((o,i)=>{
    const cls=ans?(i===q.a?"ok":i===LS.picked?"bad":""):"";
    const mark=ans?(i===q.a?" ✅":i===LS.picked?" ✗":""):"";
    const ow=q.ow&&q.ow[i];
    const sent=ans&&ow&&ow.s?`<span class="oe" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${sayBtn(ow.s)}<span style="color:var(--fg)">${esc(ow.s)}</span> ${esc(ow.se)}</span>`:"";

      <span class="ot"><b>${esc(o)}${mark}</b>${ans?`<span class="oe">${esc(q.e[i])}</span>${sent}`:""}</span></div>`;
  });

  if(ans){
    if(q.k||q.ks) h+=`<div class="key">💡 <b>Key point:</b> ${esc(q.k||"")}

function stepSpeak(){
  const sp=LS.sp;
  if(!SR) return `<div class="card"><div class="prompt">Microphone checking isn't available in this browser</div><div class="hint">Say the lesson words to Denis instead, then continue.</div></div>${nextBtn("Next: together")}`;

function bindStep(){
  const nb=$("#stepNext");
  if(nb) nb.onclick=()=>{
    if(LS.step===2&&LS.qi+1<LS.quiz.length){ LS.qi++; LS.picked=null; renderLearn(); return; }
    if(LS.step===4){ finishLesson(); return; }
    LS.step++; LS.picked=null; renderLearn(); window.scrollTo(0,0);
  };
  const ws=LESSONS[LS.i]?LESSONS[LS.i].w.map(id=>BYID[id]).filter(Boolean):[];
  const wn=$("#wNext"); if(wn) wn.onclick=()=>{
    if(LS.wi<ws.length-1){ LS.wi++; renderLearn(); say(ws[LS.wi].no); }
    else { LS.step=1; renderLearn(); window.scrollTo(0,0); }
  };
  const wp=$("#wPrev"); if(wp) wp.onclick=()=>{ LS.wi--; renderLearn(); say(ws[LS.wi].no); };
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=b.onkeydown=e=>{
    if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ") return;
    const i=+b.dataset.opt, q=LS.quiz[LS.qi]; LS.picked=i;
    if(q.n) say(q.n);
    if(i!==q.a && !q.retry){ LS.quiz.push(Object.assign({},q,{retry:true})); }
    renderLearn();
  });
  const sp=LS&&LS.sp;
  const mic=$("#lmic");
  if(mic) mic.onclick=()=>{
    if(sp.status==="listening"){ try{rec.stop();}catch(e){} return; }
    const w=BYID[sp.ids[sp.k]]; sp.status="listening"; sp.heard=""; renderLearn();
    listen(alts=>{
      const r=checkWord(alts,w); sp.heard=r.heard;
      if(r.ok){ sp.status="right"; renderLearn(); say(w.no); }
      else { sp.tries++; if(sp.tries>=3){ sp.status="revealed"; renderLearn(); say(w.no); } else { sp.status="wrong"; renderLearn(); } }
    },err=>{
      sp.status="error";
      sp.err=err==="not-allowed"||err==="service-not-allowed"?"Microphone blocked. Allow mic access for this page.":err==="no-speech"?"Didn't hear anything. Try again a bit louder.":err==="network"?"Needs an internet connection.":"Couldn't listen. Try again.";
      renderLearn();
    });
  };
  const lh=$("#lhear"); if(lh) lh.onclick=()=>say(BYID[sp.ids[sp.k]].no);
  const ls=$("#lshow"); if(ls) ls.onclick=()=>{ sp.status="revealed"; renderLearn(); say(BYID[sp.ids[sp.k]].no); };
  const lo=$("#lok"); if(lo) lo.onclick=()=>{ sp.status="right"; renderLearn(); say(BYID[sp.ids[sp.k]].no); };
  const ln=$("#lnext"); if(ln) ln.onclick=()=>{ sp.k++; sp.status="idle"; sp.tries=0; sp.heard=""; renderLearn(); };
  const tc=$("#toCards"); if(tc) tc.onclick=()=>{ LS=null; show("cards"); };
  const th=$("#toHome"); if(th) th.onclick=()=>{ LS=null; renderLearn(); window.scrollTo(0,0); };
}

    <div class="row" style="margin-top:10px">
      <button class="chip" data-tempo="0.75" aria-pressed="${AB.tempo===0.75}">Slow</button>
      <button class="chip" data-tempo="0.5" aria-pressed="${AB.tempo===0.5}">Normal</button>
      <button class="chip" id="voiceTog" aria-pressed="${AB.voice}">Voice says the letters</button>
    </div>
    <p class="note">The computer voice can't really sing, so it speaks each letter on the beat. It's even better when you sing it together with her.</p>`;
  }else{
    h+=`<p class="note">Tap the big letter to hear its name. Tap the word to hear the sound in a real word.</p>
    <div class="list">${ABC.map((a,i)=>`<div class="snd">
      <button class="L ${i>25?"ext":""}" data-say="${esc(a[1])}" aria-label="Say ${a[0]}">${a[0]}</button>
      <div class="d"><span class="nm">Name: <b>${esc(a[1])}</b></span>
        <span>${esc(a[2])}</span>
        <span class="ex">${sayBtn(a[3]," "+a[3])}<span class="note">${esc(a[4])}</span></span></div>
    </div>`).join("")}</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-abv]").forEach(b=>b.onclick=()=>{ stopSong(); AB.view=b.dataset.abv; renderAbc(); if(AB.view==="one") say(ABC[AB.li][1]); });
  const an=$("#abNext"); if(an) an.onclick=()=>{ AB.li=(AB.li+1)%ABC.length; renderAbc(); say(ABC[AB.li][1]); };
  const ap=$("#abPrev"); if(ap) ap.onclick=()=>{ AB.li--; renderAbc(); say(ABC[AB.li][1]); };
  el.querySelectorAll("[data-li]").forEach(b=>b.onclick=()=>say(ABC[+b.dataset.li][1]));
  el.querySelectorAll("[data-tempo]").forEach(b=>b.onclick=()=>{ AB.tempo=+b.dataset.tempo; const p=AB.playing; stopSong(); renderAbc(); if(p) playSong(); });
  const vt=$("#voiceTog"); if(vt) vt.onclick=()=>{ AB.voice=!AB.voice; vt.setAttribute("aria-pressed",AB.voice); };
  const sb=$("#singBtn"); if(sb) sb.onclick=()=>{ if(AB.playing){ stopSong(); renderAbc(); } else playSong(); };
}
function tone(ctx,midi,t,dur){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type="triangle"; o.frequency.value=440*Math.pow(2,(midi-69)/12);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.95);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur);
}
function playSong(){
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ toast("This browser can't play the melody"); return; }
  AB.ctx=AB.ctx||new AC(); AB.ctx.resume();
  AB.playing=true; renderAbc();
  const ctx=AB.ctx, beat=AB.tempo; let t=ctx.currentTime+0.15, wi=0;
  SONG.forEach(s=>{
    const dur=s.b*beat; tone(ctx,s.n,t,dur);
    const delay=(t-ctx.currentTime)*1000, myWi=s.w?wi++:-1;
    AB.timers.push(setTimeout(()=>{
      document.querySelectorAll(".lit").forEach(x=>x.classList.remove("lit"));
      if(s.l!==undefined){
        const b=document.querySelector(`[data-li="${s.l}"]`); if(b) b.classList.add("lit");
        if(AB.voice && "speechSynthesis" in window){
          speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(ABC[s.l][1]);
          u.lang="nb-NO"; u.rate=1.15; const v=voices.find(v=>v.name===S.settings.voice)||voices[0]; if(v) u.voice=v; speechSynthesis.speak(u);
        }
      }else{ const w=document.querySelector(`[data-wi="${myWi}"]`); if(w) w.classList.add("lit"); }
    },delay));
    t+=dur;
  });
  AB.timers.push(setTimeout(()=>{ AB.playing=false; if(current==="abc") renderAbc(); },(t-ctx.currentTime)*1000+200));
}
function stopSong(){
  AB.timers.forEach(clearTimeout); AB.timers=[]; AB.playing=false;
  if(AB.ctx){ AB.ctx.close(); AB.ctx=null; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
}

/* ---------- Word bank ---------- */
let WF="All";
function status(id){
  const n=S.srs.normal[id]; if(!n) return "new";
  const d=n.due-Date.now(); return d<=0?"due now":"next in "+fmtGap(d);
}
function renderWords(){
  const el=$("#tab-words");
  const cats=["All",...Object.keys(DATA),...(S.custom.length?["Mine"]:[])];
  const list=WORDS.filter(w=>WF==="All"||w.c===WF);
  const inDeck=list.filter(w=>S.deck[w.id]).length;
  let h=`<p class="note">Lessons add their words automatically. You can also tick words she already knows to put them in her decks early.</p>
  <div class="row">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${WF===c}">${esc(c)}</button>`).join("")}</div>
  <div class="row" style="margin-top:10px;justify-content:space-between">
    <span class="note">${inDeck} of ${list.length} in deck</span>
    <span class="row"><button class="chip" id="addAll">Add all</button><button class="chip" id="remAll">Remove all</button></span>
  </div>
  <div class="list">${list.map(w=>`<div class="item">
    <input type="checkbox" id="ck-${esc(w.id)}" data-id="${esc(w.id)}" ${S.deck[w.id]?"checked":""} aria-label="In deck: ${esc(w.no)}">
    <label class="w" for="ck-${esc(w.id)}" style="color:inherit;display:block"><b>${esc(w.no)}</b><span>${esc(w.en)}</span>${S.deck[w.id]?`<span class="st">${status(w.id)}</span>`:""}</label>
    <span class="act">${sayBtn(w.no)}${w.c==="Mine"?`<button class="iconbtn" data-del="${esc(w.id)}" aria-label="Delete ${esc(w.no)}">${ICON_X}</button>`:""}</span>
  </div>`).join("")}</div>
  <h2>Add your own word</h2>
  <form class="panel" id="addForm">
    <label>Norwegian<input type="text" id="fNo" required placeholder="en katt"></label>
    <label>English<input type="text" id="fEn" required placeholder="cat"></label>
    <label>Example sentence (Norwegian, optional)<input type="text" id="fS" placeholder="Katten sover på sofaen."></label>
    <label>Sentence in English (optional)<input type="text" id="fSe" placeholder="The cat is sleeping on the sofa."></label>
    <button class="big primary" type="submit" style="margin-top:0">Add to deck</button>
    <p class="note" style="margin:0">Tip: write nouns with en/ei/et so she learns the gender.</p>
  </form>`;
  el.innerHTML=h;
  el.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ WF=b.dataset.cat; renderWords(); });
  el.querySelectorAll("input[data-id]").forEach(c=>c.onchange=()=>{ if(c.checked) S.deck[c.dataset.id]=true; else delete S.deck[c.dataset.id]; save(); resetQueues(); renderWords(); });
  $("#addAll").onclick=()=>{ list.forEach(w=>S.deck[w.id]=true); save(); resetQueues(); renderWords(); };
  $("#remAll").onclick=()=>{ list.forEach(w=>delete S.deck[w.id]); save(); resetQueues(); renderWords(); };
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.del; S.custom=S.custom.filter(w=>w.id!==id); delete S.deck[id];
    ["normal","speak","sentence"].forEach(m=>delete S.srs[m][id]); save(); reindex(); resetQueues(); renderWords();
  });
  $("#addForm").onsubmit=e=>{
    e.preventDefault();
    const no=$("#fNo").value.trim(), en=$("#fEn").value.trim(); if(!no||!en) return;
    const id="Mine:"+no+":"+Date.now().toString(36);
    S.custom.push({id,no,en,s:$("#fS").value.trim(),se:$("#fSe").value.trim()});
    S.deck[id]=true; save(); reindex(); resetQueues(); WF="Mine"; renderWords(); toast("Added "+no);
  };
}
function resetQueues(){ N.queue=null; N.flipped=false; N.dir=null; SP.queue=null; SP.reset(); }

/* ---------- Settings ---------- */
let confirmReset=false;
function renderSettings(){
  const el=$("#tab-settings"), st=S.settings;
  el.innerHTML=`<h2 style="margin-top:0">Voice</h2>
  <div class="panel">
    ${voices.length?`<label>Norwegian voice<select id="sVoice">${voices.map(v=>`<option ${v.name===st.voice?"selected":""}>${esc(v.name)}</option>`).join("")}</select></label>`
      :`<p class="note" style="margin:0">No Norwegian voice was found on this device. On iPhone: Settings → Accessibility → Spoken Content → Voices → Norwegian. On Android/Samsung: Settings → General management → Text-to-speech → set Preferred engine to Speech Recognition and Synthesis from Google → tap the gear → Install voice data → Norwegian (Norsk bokmål). Then restart Chrome. On Windows: Settings → Time &amp; language → Speech → add Norwegian.</p>`}
    <label>Speed <span id="rateVal">${st.rate.toFixed(2)}×</span><input type="range" id="sRate" min="0.5" max="1.2" step="0.05" value="${st.rate}"></label>
    <div>${sayBtn("Hei! Jeg heter Nora. Hvordan går det?"," Test voice")}</div>
  </div>
  <h2>Study</h2>
  <div class="panel">
    <label>New words per day (each deck)<input type="range" id="sNew" min="3" max="30" step="1" value="${st.newPerDay}"><span id="newVal">${st.newPerDay} words</span></label>
  </div>
  <h2>Backup</h2>
  <div class="panel">
    <p class="note" style="margin:0">Progress is saved in this browser only. Export a backup now and then, or to move to another device.</p>
    <div class="row"><button class="chip" id="exp">Export backup</button>
      <label class="chip" style="display:inline-block;color:var(--muted)">Import backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
    ${confirmReset?`<div class="row"><span class="note">Delete all progress and custom words?</span><button class="chip" id="rYes" style="border-color:var(--bad);color:var(--bad)">Yes, reset</button><button class="chip" id="rNo">Cancel</button></div>`
      :`<button class="link" id="rst" style="justify-self:start;color:var(--bad)">Reset all progress</button>`}
  </div>`;
  const sv=$("#sVoice"); if(sv){ if(!st.voice&&voices[0]) st.voice=voices[0].name; sv.onchange=()=>{ st.voice=sv.value; save(); }; }
  $("#sRate").oninput=e=>{ st.rate=+e.target.value; $("#rateVal").textContent=st.rate.toFixed(2)+"×"; save(); };
  $("#sNew").oninput=e=>{ st.newPerDay=+e.target.value; $("#newVal").textContent=st.newPerDay+" words"; save(); resetQueues(); };
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="norsk-ordkort-backup-"+today()+".json";
    document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved");
  };
  $("#imp").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    f.text().then(t=>{ const d=JSON.parse(t); if(!d.deck||!d.srs) throw 0; S=d; save(); S=load(); reindex(); resetQueues(); toast("Backup loaded"); renderSettings(); })
     .catch(()=>toast("That file isn't a Norsk Ordkort backup"));
  };
  const r=$("#rst"); if(r) r.onclick=()=>{ confirmReset=true; renderSettings(); };
  const y=$("#rYes"); if(y) y.onclick=()=>{ S=blank(); save(); reindex(); resetQueues(); confirmReset=false; renderSettings(); toast("Progress reset"); };
  const n=$("#rNo"); if(n) n.onclick=()=>{ confirmReset=false; renderSettings(); };
}

show("learn");
</script>
